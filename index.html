<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CCNN Esport</title>

  <!-- Google Font for Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Cinzel:wght@700;900&display=swap" rel="stylesheet">

  <!-- 3D Model Viewer Library for UCL Tab Podium -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <!-- Firebase App & Realtime Database SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root {
      /* LIQUID GLASS DESIGN SYSTEM */
      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-card: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.28);
      --glass-specular: rgba(255, 255, 255, 0.35);
      --accent: #00e5ff;
      --accent-glow: rgba(0, 229, 255, 0.4);
      --ucl-blue: #3b82f6;
      --ucl-glow: rgba(59, 130, 246, 0.55);
      --gold: #ffd700;
      --text: #ffffff;
      --muted: rgba(240, 246, 255, 0.7);

      --win: #22c55e;
      --draw: #94a3b8;
      --loss: #ef4444;

      /* iOS Spring Animation Bezier */
      --ios-spring: cubic-bezier(0.32, 0.72, 0, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #030712 url('theme-bg.jpg') center top / cover fixed no-repeat;
      min-height: 100vh;
      color: var(--text);
      padding-bottom: 98px;
      overflow-x: hidden;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 8%, rgba(0, 229, 255, 0.1) 0%, rgba(3, 7, 18, 0.3) 85%);
      pointer-events: none;
      z-index: 0;
    }

    @keyframes liquidRefract {
      0% { opacity: 0; transform: translateY(12px) scale(0.985); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(32px) saturate(210%);
      -webkit-backdrop-filter: blur(32px) saturate(210%);
      border-bottom: 1px solid var(--glass-border);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.25), inset 0 1px 0 var(--glass-specular);
      padding: 14px 20px;
      text-align: center;
    }

    .website-name {
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(180deg, #ffffff 30%, rgba(255, 255, 255, 0.65) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
    }

    .live-indicator {
      font-size: 10px;
      font-weight: 800;
      color: var(--win);
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-top: 2px;
    }

    .live-dot {
      width: 7px;
      height: 7px;
      background: var(--win);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--win);
    }

    .ucl-music-toggle-btn {
      display: none;
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(59, 130, 246, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: #fff;
      padding: 6px 12px;
      border-radius: 14px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      backdrop-filter: blur(20px);
      box-shadow: 0 4px 16px var(--ucl-glow), inset 0 1px 0 rgba(255, 255, 255, 0.4);
      align-items: center;
      gap: 6px;
      transition: transform 0.25s var(--ios-spring);
    }

    .ucl-music-toggle-btn:active { transform: translateY(-50%) scale(0.92); }

    .content-area {
      position: relative;
      z-index: 1;
      padding: 16px;
      max-width: 680px;
      margin: auto;
    }

    .view-card { display: none; animation: liquidRefract 0.42s var(--ios-spring) forwards; }
    .view-card.active { display: block; }

    #page-ucl {
      position: relative;
      background: linear-gradient(rgba(5, 11, 26, 0.35), rgba(4, 8, 20, 0.45)), url('ucl-bg.jpg') center/cover no-repeat;
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 14px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35), inset 0 1px 1px var(--glass-specular);
      backdrop-filter: blur(30px) saturate(190%);
    }

    /* LIQUID GLASS SURFACE CARDS */
    .league-banner,
    .hero-leader-card,
    .champion-subcard,
    .prediction-card,
    .table-card,
    .legend-card,
    .match-glass-card,
    .manager-profile-card,
    .trophy-room-showcase-wrap,
    .social-media-card,
    .admin-section-pane {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.03) 100%) !important;
      backdrop-filter: blur(32px) saturate(210%) !important;
      border: 1px solid var(--glass-border) !important;
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.25), inset 0 1px 1px var(--glass-specular) !important;
      transition: transform 0.3s var(--ios-spring), box-shadow 0.3s var(--ios-spring);
    }

    .league-banner {
      border-radius: 20px;
      padding: 14px 18px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .league-title-label {
      font-size: 11px;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 800;
      text-shadow: 0 0 12px var(--accent-glow);
    }

    .league-title-name {
      font-size: 17px;
      font-weight: 900;
      color: #fff;
      letter-spacing: 0.5px;
      margin-top: 2px;
      text-transform: uppercase;
    }

    .season-tag {
      background: rgba(0, 229, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: var(--accent);
      font-size: 11px;
      font-weight: 800;
      padding: 5px 12px;
      border-radius: 22px;
      text-transform: uppercase;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.3), 0 0 10px rgba(0, 229, 255, 0.2);
    }

    .hero-leader-card {
      border-radius: 22px;
      padding: 16px 18px;
      margin-bottom: 14px;
      position: relative;
    }

    .hero-label {
      font-size: 11px;
      font-weight: 800;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-bottom: 8px;
      text-shadow: 0 0 8px var(--accent-glow);
    }

    .hero-row { display: flex; justify-content: space-between; align-items: center; }

    .hero-team-name {
      font-size: 20px;
      font-weight: 900;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .hero-pts {
      font-size: 24px;
      font-weight: 900;
      color: var(--accent);
      line-height: 1;
      text-shadow: 0 0 12px var(--accent-glow);
    }

    .hero-pts-label { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; }

    .hero-streak {
      margin-top: 6px;
      font-size: 11px;
      font-weight: 800;
      color: var(--win);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
    }

    .home-mid-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 14px;
      align-items: stretch;
    }

    .stacked-champs-column { display: flex; flex-direction: column; gap: 12px; height: 100%; }

    .champion-subcard {
      border-radius: 20px;
      padding: 12px 14px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .champ-sub-title { font-size: 10px; font-weight: 800; text-transform: uppercase; color: var(--muted); }
    .champ-sub-name { font-size: 15px; font-weight: 900; color: #fff; text-transform: uppercase; margin-top: 4px; }
    .champ-badge-tag { font-size: 10px; font-weight: 800; text-transform: uppercase; display: inline-block; margin-top: 4px; }

    /* DYNAMIC FEED CARD & SLIDER (EDGE-TO-EDGE) */
    .social-media-card {
      border-radius: 20px !important;
      padding: 0 !important;
      height: 100%;
      min-height: 240px;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--glass-border) !important;
    }

    .social-carousel-viewport {
      display: flex;
      width: 100%;
      height: 100%;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      position: absolute;
      inset: 0;
      border-radius: 20px;
    }
    .social-carousel-viewport::-webkit-scrollbar { display: none; }

    .social-slide {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      scroll-snap-align: start;
      background-position: center center;
      background-size: cover;
      background-repeat: no-repeat;
      padding: 20px; /* Text padding within slide */
      position: relative;
    }

    .social-slide::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(3, 7, 18, 0) 20%, rgba(3, 7, 18, 0.6) 60%, rgba(3, 7, 18, 0.9) 100%);
        z-index: 1;
    }

    /* Fixed cases for images */
    .social-slide-1 { background-image: url('social-bg-1.jpg'); }
    .social-slide-2 { background-image: url('social-bg-2.jpg'); }
    .social-slide-3 { background-image: url('social-bg-3.jpg'); }

    /* Content Styling within Dynamic Slides */
    .social-content-area {
        position: relative;
        z-index: 2;
        height: 100%;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
    }

    .news-title {
        font-size: 14px;
        font-weight: 900;
        line-height: 1.3;
        color: #fff;
        text-transform: uppercase;
        margin-bottom: 6px;
    }

    .news-tag {
        font-size: 9px;
        color: var(--accent);
        background: rgba(0, 229, 255, 0.15);
        border: 1px solid var(--glass-border);
        padding: 3px 6px;
        border-radius: 6px;
        align-self: flex-start;
        text-transform: uppercase;
        font-weight: 800;
    }

    /* Fan Tweet Styling */
    .fan-handle { color: var(--muted); font-size: 10px; font-weight: 700; display: block; margin-bottom: 3px; }
    .fan-text { color: #fff; font-size: 13px; font-weight: 600; line-height: 1.3; }

    /* Pundit Quote Styling */
    .pundit-quote { color: #fff; font-size: 13px; font-weight: 600; font-style: italic; line-height: 1.3; border-left: 2px solid var(--accent); padding-left: 8px; margin-bottom: 4px; }
    .pundit-name { color: var(--gold); font-size: 10px; font-weight: 800; text-transform: uppercase; }

    /* Paginations dots (edge-to-edge relative position) */
    .social-dots-indicator {
      position: absolute;
      bottom: 12px;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      z-index: 10;
      pointer-events: none;
    }

    .social-dot {
      width: 6px; height: 6px; border-radius: 50%; background: rgba(255, 255, 255, 0.4);
      transition: all 0.25s var(--ios-spring);
    }

    .social-dot.active {
      width: 18px; border-radius: 8px; background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    /* Standard Cards Styling */
    .prediction-card { border-radius: 22px; padding: 16px 14px; margin-bottom: 14px; }
    .prediction-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .prediction-title { font-size: 11px; font-weight: 800; color: var(--accent); text-transform: uppercase; text-shadow: 0 0 8px var(--accent-glow); }
    .prediction-subtext { font-size: 10px; color: var(--muted); font-weight: 700; text-transform: uppercase; }
    .prediction-graph-container { display: flex; justify-content: space-around; align-items: flex-end; min-height: 210px; padding: 10px 4px 4px 4px; gap: 8px; border-bottom: 1px solid rgba(255, 255, 255, 0.12); overflow-x: auto; }
    .graph-column { display: flex; flex-direction: column; align-items: center; flex: 1; min-width: 58px; height: 100%; justify-content: flex-end; gap: 6px; }
    .graph-logo-slot { margin-bottom: 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .graph-logo-slot .team-badge { width: 32px; height: 32px; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4); }
    .graph-team-name { font-size: 10px; font-weight: 800; color: #f1f5f9; text-transform: uppercase; text-align: center; }
    .graph-bar-track { width: 32px; height: 130px; background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.22); border-radius: 10px; position: relative; display: flex; flex-direction: column; justify-content: flex-end; overflow: hidden; box-shadow: inset 0 2px 6px rgba(0,0,0,0.3); }
    .graph-bar-fill { width: 100%; background: linear-gradient(180deg, var(--accent) 0%, rgba(0, 150, 255, 0.75) 100%); border-radius: 8px 8px 0 0; transition: height 0.8s var(--ios-spring); position: relative; box-shadow: 0 0 16px var(--accent-glow); }
    .graph-bar-fill.leader-bar { background: linear-gradient(180deg, var(--gold) 0%, #f59e0b 100%); box-shadow: 0 0 18px rgba(255, 215, 0, 0.55); }
    .graph-percentage-label { font-size: 11px; font-weight: 900; color: #ffffff; text-align: center; margin-top: 4px; }

    .table-card { border-radius: 22px; padding: 12px 6px; overflow-x: auto; margin-bottom: 14px; }
    table { width: 100%; min-width: 540px; border-collapse: collapse; font-size: 13px; text-align: center; }
    th { color: var(--muted); padding: 10px 6px; font-size: 11px; text-transform: uppercase; font-weight: 700; border-bottom: 1px solid rgba(255, 255, 255, 0.14); }
    td { padding: 11px 6px; border-bottom: 1px solid rgba(255, 255, 255, 0.07); color: #ffffff; font-weight: 600; }
    tr.ucl-qualify td:first-child::before { content: ""; position: absolute; left: 2px; top: 18%; height: 64%; width: 3.5px; background: var(--ucl-blue); border-radius: 3px; box-shadow: 0 0 10px var(--ucl-glow); }
    .team-col { text-align: left; display: flex; align-items: center; gap: 9px; font-weight: 700; }
    .team-badge { width: 26px; height: 26px; border-radius: 50%; background: rgba(255, 255, 255, 0.15); border: 1px solid var(--glass-border); display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; color: #fff; object-fit: cover; box-shadow: 0 2px 8px rgba(0,0,0,0.25); }
    .pts-col { color: var(--accent); font-weight: 900; font-size: 14px; text-shadow: 0 0 10px var(--accent-glow); }
    .status-badge { width: 17px; height: 17px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; }
    .badge-win { background: var(--win); color: #fff; }
    .badge-draw { background: var(--draw); color: #fff; }
    .badge-loss { background: var(--loss); color: #fff; }
    .match-strip { display: inline-flex; align-items: center; gap: 4px; }

    /* Rest of the standard CSS continues... */
    .legend-card { margin-top: 14px; padding: 14px 18px; border-radius: 20px; }
    .match-toggle-bar { display: flex; background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(24px); border: 1px solid var(--glass-border); border-radius: 16px; padding: 4px; margin-bottom: 16px; }
    .match-toggle-btn { flex: 1; background: transparent; border: none; color: var(--muted); font-size: 12px; font-weight: 800; padding: 8px; border-radius: 12px; cursor: pointer; text-transform: uppercase; }
    .match-toggle-btn.active { background: rgba(255, 255, 255, 0.18); color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.4); }
    .match-glass-card { border-radius: 20px; padding: 12px 16px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; }
    .score-box { font-size: 16px; font-weight: 900; color: var(--text); min-width: 24px; text-align: right; }
    .ucl-trophy-podium { text-align: center; padding: 16px 14px 18px 14px; background: radial-gradient(circle at center, rgba(59, 130, 246, 0.2) 0%, rgba(255, 255, 255, 0.05) 75%); border: 1px solid rgba(59, 130, 246, 0.6); border-radius: 24px; margin-top: 16px; box-shadow: 0 12px 36px var(--ucl-glow); }
    .ucl-trophy-3d { width: 100%; max-width: 190px; height: 140px; margin: 0 auto; display: block; filter: drop-shadow(0 0 18px rgba(59, 130, 246, 0.7)); }
    .nav-item.active svg { stroke: #ffffff; filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.6)); }
    .admin-subnav-pills { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 14px; scrollbar-width: none; }
    .admin-pill-btn { background: rgba(255, 255, 255, 0.08); border: 1px solid var(--glass-border); color: var(--muted); padding: 9px 15px; border-radius: 16px; font-size: 11px; font-weight: 800; text-transform: uppercase; }
    .admin-pill-btn.active { background: rgba(255, 255, 255, 0.22); border-color: rgba(255, 255, 255, 0.5); color: #fff; }

  </style>
</head>
<body>

  <audio id="uclAnthemAudio" preload="auto">
    <source src="anthem.mp3" type="audio/mpeg">
    <source src="https://ia800902.us.archive.org/27/items/uefa-champions-league-anthem/uefa-champions-league-anthem.mp3" type="audio/mpeg">
  </audio>

  <header>

    <!-- Other tabs continue (League, Matches, UCL, Managers, Admin)... -->
    <!-- [REDACTED FOR BREVITY - PRESERVED EXACTLY AS BEFORE] -->

  </main>

  <nav class="bottom-nav">
      <!-- Standard Nav Items as before... -->
  </nav>

  <script>
    /* FIREBASE CONFIGURATION */
    const firebaseConfig = { apiKey: "AIzaSyBQ9Gt_u581RDoc4OlJ2yC-bk5SFqR-fC8", authDomain: "ccnn-esport.firebaseapp.com", databaseURL: "https://ccnn-esport-default-rtdb.asia-southeast1.firebasedatabase.app", projectId: "ccnn-esport", appId: "1:303400637615:web:a321d54cf048f54820705a" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const stateRef = db.ref('esport_state');

    let isAdminUnlocked = localStorage.getItem('ccnn_admin_logged_in') === 'true';
    let state = { leagueName: '', season: '', teams: [], fixtures: [], results: [], managers: [], ucl: {} };

    stateRef.on('value', snapshot => {
      state = snapshot.val() || state;
      renderAll();
      updateDynamicNewsFeed(); // Automatically update news when data changes
    });

    // SOCIAL MEDIA DYNAMIC FEED ENGINE
    function updateDynamicNewsFeed() {
        if (!state.teams.length) return;

        // Calculate latest standings to get context
        const standings = calculateStandingsForComp('league');
        const topTeam = standings[0];
        const lastResult = state.results ? state.results[state.results.length - 1] : null;

        let newsContent = { tag: 'HEADLINES', text: '' };
        let fanContent = { handle: '@Fan_Reacts', text: '' };
        let punditContent = { name: '', text: '' };

        // 1. Media News Logic (Context: Top Race/Last Game)
        if (topTeam && topTeam.p > 0) {
            newsContent.text = `${topTeam.name.toUpperCase()} EXTEND LEAD AT THE TOP AFTER LATEST ROUND OF FIXTURES`;
            newsContent.tag = 'TITLE RACE';
        } else {
            newsContent.text = "SEASON UNDERWAY: SQUADS PREPARE FOR OPENING FIXTURES AMID HIGH EXPECTATIONS";
        }

        // 2. Fan Troll Logic (Context: Big Win/Loss)
        if (lastResult) {
            const home = getTeam(lastResult.homeId);
            const away = getTeam(lastResult.awayId);
            if (lastResult.hScore > lastResult.aScore + 2) {
                fanContent.handle = '@RivalWatch';
                fanContent.text = `Absolutely cooked them 💀 ${away.name} defenders were controller disconnected the whole game. #EzDubs`;
            } else if (lastResult.aScore > lastResult.hScore + 2) {
                fanContent.text = `Meltdown incoming on ${home.name} forums. How do you lose that badly at home? Sack them all. 🤡 #Disgrace`;
            } else {
                fanContent.text = `Decent game but the standard is dipping. Can't believe I wasted my evening watching that bore draw. #SleepyFootball`;
            }
        } else {
            fanContent.text = "Just announce the fixtures already, the suspense is killing me. If we don't win the league this year I'm retiring from football fandom.";
        }

        // 3. Retired Pundit Verdict Logic
        const pundits = [
            { name: "Zlatan Ibrahimović", quotes: ["Zlatan is not amused. The lion does not compare himself to humans, but humans must at least try to play football.", "This was not football. This was Zlatan watching others try to be Zlatan."] },
            { name: "Thierry Henry", quotes: ["You cannot talk about defending when you leave a runway open behind your backline. Not acceptable.", "I am sorry, but there is no desire. No hunger. You cannot win anything without that."] },
            { name: "Roy Keane", quotes: ["Absolute disgrace. Lack of hunger, lack of desire. I'd have walked home in the rain.", "I'm sick of the excuses. These are professional players, start acting like it."] }
        ];

        // Choose quote based on last result nature or random
        let chosenPundit;
        if (lastResult && lastResult.hScore === lastResult.aScore) {
            chosenPundit = pundits[1]; // Henry often critiques lack of offensive desire in draws
        } else if (lastResult && Math.abs(lastResult.hScore - lastResult.aScore) > 3) {
            chosenPundit = pundits[2]; // Keane for heavy losses
        } else {
            chosenPundit = pundits[0]; // Zlatan by default
        }

        punditContent.name = chosenPundit.name;
        punditContent.text = chosenPundit.quotes[Math.floor(Math.random() * chosenPundit.quotes.length)];

        // Inject Content into HTML Slides
        document.getElementById('newsFeedSlide').innerHTML = `<span class="news-tag">${newsContent.tag}</span><h3 class="news-title">${newsContent.text}</h3>`;
        document.getElementById('fanFeedSlide').innerHTML = `<span class="fan-handle">${fanContent.handle}</span><p class="fan-text">${fanContent.text}</p>`;
        document.getElementById('punditFeedSlide').innerHTML = `<p class="pundit-quote">${punditContent.text}</p><span class="pundit-name">-- ${punditContent.name}</span>`;
    }

    // Standard Render Logic and Tab switching continued exactly as before...
    // [REDACTED FOR BREVITY - PRESERVED]

  </script>
